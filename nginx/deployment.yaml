apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ibm1
  template:
    metadata:
      labels:
        app: ibm1
    spec:
      containers:
      - name: app
        image: nginx
        ports:
        - containerPort: 80
